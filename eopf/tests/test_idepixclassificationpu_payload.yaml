# =============================================================
# Payload Configuration File for Polymer Processor
# =============================================================
# This payload defines the execution parameters for the Polymer
# atmospheric correction processor within the EOPF-CPM framework.
#
# Input: Sentinel-2 MSI L1C product (Zarr format)
# Output: Pass-through (identity) — returns inputs unchanged

# -------------------------------------------------------------
# General Configuration
# -------------------------------------------------------------
general_configuration:
  logging:
    level: INFO
  triggering__use_basic_logging: true
  triggering__wait_before_exit: 2
  triggering__use_default_filename: false
  triggering__validate_run: false
  triggering__validate_mode: NONE
  dask_utils__timeout: 1800

# -------------------------------------------------------------
# Workflow Definition
# -------------------------------------------------------------
workflow:
- name: l2w_processor
  active: true
  module: sen2water.msiidepix.idepixmainpu
  processing_unit: IdepixMainPU

  inputs:
    l1c: S2_L1C_resampled

  outputs:
    .*: S2_L1C_idepix

  # parameters:
    # Polymer processing parameters (forwarded to run_polymer_dataset
    # when the hygeos/polymer pipeline is enabled).
    # sensor: MSI
    # gsw_agg: 3

# -------------------------------------------------------------
# Input/Output (I/O) Configuration
# -------------------------------------------------------------
io:
  input_products:
  - id: S2_L1C_resampled
#    path: test_l2w/S02MSIL1C_20210627T100559_0000_B022_TC33_T32TPS.zarr
#    path: test_l2w/S2B_MSIL1C_20250811T102559_N0511_R108_T32UMB_20250811T124509-resampled.nc
    path: /windows/tmp/sen2water/S2A_MSIL1C_20260313T101741_N0512_R065_T32TMR_20260313T153853_resampled.zarr/resampled.zarr
    engine: cpm_zarr
#    engine: cpm_netcdf

  output_products:
  - id: S2_L1C_idepix
    path: /windows/tmp/sen2water/S2A_MSIL1C_20260313T101741_N0512_R065_T32TMR_20260313T153853_idepix.nc
    type: file
#    engine: cpm_zarr
    engine: cpm_netcdf
    writer_params:
      mode: "w"

