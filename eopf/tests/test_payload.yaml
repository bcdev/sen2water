# =============================================================
# Payload Configuration File for Polymer Processor
# =============================================================
# This payload defines the execution parameters for the Polymer
# atmospheric correction processor within the EOPF-CPM framework.
#
# Input: Sentinel-2 MSI L1C product (Zarr format)
# Output: Pass-through (identity) — returns inputs unchanged

# -------------------------------------------------------------
# General Configuration
# -------------------------------------------------------------
general_configuration:
  logging:
    level: INFO
  triggering__use_basic_logging: true
  triggering__wait_before_exit: 10
  triggering__use_default_filename: false
  triggering__validate_run: true
  triggering__validate_mode: NONE
  dask_utils__timeout: 1800

# -------------------------------------------------------------
# Workflow Definition
# -------------------------------------------------------------
workflow:
- name: l2w_processor
  active: true
  module: l2w_v1.computing.l2w_v1
  processing_unit: L2WV1Processor

  inputs:
    l1c: S2_L1C_TC33

  adfs:
    l2w_prototype: S2_L2W_TC33

  outputs:
    .*: output_folder

  # parameters:
    # Polymer processing parameters (forwarded to run_polymer_dataset
    # when the hygeos/polymer pipeline is enabled).
    # sensor: MSI
    # gsw_agg: 3

# -------------------------------------------------------------
# Input/Output (I/O) Configuration
# -------------------------------------------------------------
io:
  input_products:
  - id: S2_L1C_TC33
    path: test_l2w/S02MSIL1C_20210627T100559_0000_B022_TC33_T32TPS.zarr
#    path: /windows/tmp/eopf/polymer/tests/test_l1c/S02MSIL1C_20210627T100559_0000_B022_TC33_T32TPS.zarr
    engine: cpm_zarr

  adfs:
  - id: S2_L2W_TC33
#    path: test_l2w/S2A_MSIL2W_20220207T101201_N0400_R022_T33UUA_20251105T114657.nc
    path: test_l2w/S2B_MSIL2W_20250811T102559_N0511_R108_T32UMB_20260501T064100.nc
#    path: /windows/tmp/eopf/S2A_MSIL2W_20220207T101201_N0400_R022_T33UUA_20251105T114657.nc

  output_products:
  - id: output_folder
    path: test_l2w/
    type: folder
    engine: cpm_zarr
#    engine: cpm_netcdf
    writer_params:
      mode: "w"

